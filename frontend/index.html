<!DOCTYPE html>

  <title>Kintsugi — A Game of Vanishing Floors</title>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=JetBrains+Mono:wght@300;400;500;600&amp;family=Noto+Serif:wght@300;400&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
    .bg-radial-gradient {
      background: radial-gradient(circle at 50% 20%, rgba(33, 31, 30, 0.5) 0%, rgba(14, 13, 12, 0.98) 75%);
    }
    .kintsugi-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-tertiary-container": "#372700",

            "primary-fixed-dim": "#ffb5a0",

            "error-container": "#93000a",
            "on-background": "#e6e1df",

            "outline": "#a88a82",
            "on-surface-variant": "#e1bfb6",
            "on-secondary-fixed": "#002018",
            "secondary-fixed-dim": "#9bd2bf",
            "on-secondary-container": "#8dc3b1",
            "secondary-container": "#1b5243",
            "on-primary-fixed": "#3b0900",
            "on-tertiary": "#402d00",
            "primary-fixed": "#ffdbd1",
            "inverse-on-surface": "#32302f",
            "primary": "#ffb5a0",
            "tertiary": "#ebc166",
            "secondary-fixed": "#b6eeda",
            "on-secondary": "#00382c",
            "background": "#141312",
            "on-primary-fixed-variant": "#872100",
            "tertiary-container": "#b08b37",
            "surface-tint": "#ffb5a0",
            "surface-variant": "#363433",
            "on-primary": "#601400",
            "tertiary-fixed": "#ffdf9e",
            "secondary": "#9bd2bf",

            "primary-container": "#f36238"

          borderRadius: {

            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"

          spacing: {

<body class="bg-surface font-body-default text-body-default text-on-surface antialiased bg-radial-gradient min-h-screen relative selection:bg-tertiary-container selection:text-on-tertiary-container">
  <!-- Subtle Grain Noise Overlay -->
  <div class="pointer-events-none fixed inset-0 z-50 kintsugi-noise opacity-40"></div>

  <!-- Header -->
  <header class="fixed top-0 w-full z-40 bg-surface/85 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.35)]">
    <div class="h-16 w-full px-margin-mobile lg:px-margin flex items-center justify-between">
      
      <!-- Logo Branding -->
      <div class="flex items-center gap-space-md cursor-pointer" onclick="navigate('ritual')">
        <div class="flex items-baseline gap-space-xs">
          <span class="font-title-editorial text-title-editorial text-on-surface tracking-widest font-normal">KINTSUGI</span>
          <span class="font-kanji-accent text-data-mono text-tertiary opacity-90 pl-space-xs">金継ぎ</span>
        </div>
        <div class="hidden md:block w-px h-3.5 bg-outline-variant/30"></div>
        <span class="hidden md:inline font-data-mono text-data-mono text-on-surface-variant/60 tracking-wider lowercase">a game of vanishing floors</span>
      </div>

      <!-- Navigation Tabs -->
      <nav class="hidden lg:flex items-center gap-space-lg" data-active-classes="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-space-sm py-1 rounded">
        <a aria-current="page" class="tracking-widest transition-colors bg-primary-container text-on-primary-container font-label-caps text-label-caps px-space-sm py-1 rounded" data-path="ritual" href="#">01 RITUAL</a>
        <a class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface tracking-widest transition-colors" data-path="board" href="#">02 THE BOARD</a>
        <a class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface tracking-widest transition-colors" data-path="workshop" href="#">03 WORKSHOP</a>
        <a class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface tracking-widest transition-colors" data-path="posterity" href="#">04 POSTERITY</a>
      </nav>

      <!-- System Controls & Sync Pill -->
      <div class="flex items-center gap-space-md">
        <div class="flex items-center gap-space-sm text-on-surface-variant">
          <button class="flex items-center justify-center p-1.5 rounded hover:bg-surface-container-high hover:text-on-surface transition-colors" title="Soundscape Ritual" type="button">
            <span class="material-symbols-outlined text-[18px]">volume_down</span>
          </button>
          <button class="flex items-center justify-center p-1.5 rounded hover:bg-surface-container-high hover:text-on-surface transition-colors" title="Ambient Drift" type="button">
            <span class="material-symbols-outlined text-[18px]">air</span>
          </button>
          <div class="flex items-center gap-1.5 px-space-xs py-0.5 rounded bg-surface-container-lowest" id="sync-pill">
            <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse" id="sync-dot"></span>
            <span class="hidden sm:inline font-data-mono text-data-mono text-secondary tracking-widest" id="sync-label">SYNC</span>
          </div>
        </div>
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-[0_0_12px_rgba(243,98,56,0.18)]">
          <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </div>
      </div>

    </div>
  </header>

  <!-- Dynamic Page Root -->
  <main class="w-full pt-16 bg-transparent relative z-10" id="app">
    <!-- Screen content injected by app.js router -->
  </main>

  <!-- Editorial Zen Footer -->
  <footer class="w-full bg-surface-container-lowest relative z-10 py-space-xl mt-space-xl border-t border-outline-variant/10">
    <div class="w-full px-margin-mobile lg:px-margin flex flex-col md:flex-row items-start md:items-center justify-between gap-space-md">
      <div class="flex flex-col gap-space-xs">
        <div class="flex items-center gap-space-xs">
          <span class="font-title-editorial text-title-editorial text-on-surface">KINTSUGI</span>
          <span class="font-kanji-accent text-data-mono text-tertiary">破片</span>
        </div>
        <p class="font-data-mono text-data-mono text-on-surface-variant/60 tracking-wider max-w-sm">
          Basalt arena telemetry and erosion protocol. Every turn dissolves stone; every fracture holds memory.
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-space-lg">
        <div class="flex items-center gap-space-xs">
          <span class="font-data-mono text-data-mono text-on-surface-variant/40">EPOCH:</span>
          <span class="font-data-mono text-data-mono text-tertiary">4.82.01</span>
        </div>
        <div class="flex items-center gap-space-xs">
          <span class="font-data-mono text-data-mono text-on-surface-variant/40">FLOOR:</span>
          <span class="font-data-mono text-data-mono text-secondary">64/64 RESIDUAL</span>
        </div>
        <div class="flex items-center gap-space-xs">
          <span class="font-data-mono text-data-mono text-on-surface-variant/40">ENGINE:</span>
          <span class="font-data-mono text-data-mono text-primary">FASTAPI REST</span>
        </div>
      </div>
      <div class="font-data-mono text-data-mono text-on-surface-variant/40 tracking-widest uppercase">
        © MMXXIV VANISHING FLOORS
      </div>
    </div>
  </footer>

  <!-- Application Modules -->
  <script src="js/api.js"></script>
  <script src="js/ritual.js"></script>
  <script src="js/board.js"></script>
  <script src="js/workshop.js"></script>
  <script src="js/posterity.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
